name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *" # Se ejecuta todos los días 00:00 UTC
  workflow_dispatch: # Permite ejecutarlo manualmente desde Actions
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Chagui68
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Slow down snake speed by 36%
        shell: bash
        run: |
          for f in dist/*.svg; do
            perl -i -pe 's/dur="(\d+(?:\.\d+)?)s"/"dur=\"" . ($1 * 1.44) . "s\""/ge' "$f"
          done

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
